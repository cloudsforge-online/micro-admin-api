name: CI

# The whole file. Every service in the estate calls the ONE reusable workflow in micro-org rather
# than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI files.
# If this repository ever needs a job of its own, that is the signal the reusable workflow needs an
# input, not that this repository needs a fork of it.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres `ci_test` container, and FAILS
# the build if the database-backed suite skipped — which is why `src/testsupport.ts` reads
# `ADMIN_API_TEST_DATABASE_URL` spelled exactly as the workflow exports it. It also enforces the
# estate rules (one database, no cross-service imports, the three health endpoints, no unleased
# timers) that repository walls used to enforce for free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: admin-api
      database-env-var: ADMIN_API_DATABASE_URL
      port: 4014
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. The URLs below are never dialled, because
      # /livez makes no outbound call.
      #
      # THE SENTENCE THAT USED TO BE HERE — "throwaway values that only have to clear a length
      # check and a placeholder check" — WAS THE DEFECT STATED OUT LOUD IN CONFIGURATION. A length
      # check plus a deny-list of exact strings is precisely the pair that let micro-org #142's
      # 40-character `estate-only-outbox-secret-…` onto 44 containers on both networks: it was long
      # enough, and it was on nobody's list. `env.ts` now runs `@cloudsforge/secrets`, which checks
      # the SHAPE of the value instead, and has no CI exemption on purpose.
      #
      # The answer is not a weaker guard. CI does not need a WEAK secret, it needs A secret —
      # nothing in the smoke test verifies a signature against anything else — so the shared
      # workflow expands `=@generate` into a fresh `openssl rand -base64 48` per run and throws it
      # away (micro-org `service-ci.yml`, the `env_args` loop).
      smoke-env: |
        OUTBOX_SIGNING_SECRET=@generate
        # ── ADMIN_API_SERVICE_TOKEN IS THE ONE VARIABLE `@generate` CANNOT SERVE ───────────────
        #
        # It is a `cfsc_` CREDENTIAL (micro-org #222), it is REQUIRED — `upstreams.ts` presents it
        # on every ledger call, because `ledger/src/server.ts`'s `authorise` refuses a user
        # principal outright — and unlike wallet, settlement, market and hub-api this service has
        # never made its credential optional. So it cannot simply be omitted the way theirs are:
        # the container would exit at import and never answer /livez.
        #
        # `@generate` cannot serve it either: `openssl rand` produces a base64 KEY, and this slot
        # needs `cfsc_` + base64url. So this line used to carry a readable literal,
        # `cfsc_ci-only-NOT-a-real-credential-…`, with a note saying it passed ONLY because
        # `assertServiceCredential` ran no placeholder-marker check, and that the day that check
        # was added this line should go red and move to a `@credential` form.
        #
        # That day is today. The marker check is in @cloudsforge/secrets 1.2.0 — a `cfsc_` prefix
        # on a placeholder was a hole big enough to boot a real service — and `service-ci.yml` now
        # has the `@credential` expansion the note asked for. It mints `cfsc_` + 43 base64url
        # characters per run, which is the 32-byte floor exactly, and throws it away.
        #
        # A per-run value is better than the literal for the reason `service-ci.yml` already gives
        # about committed key-shaped strings, and for one more: the base64url alphabet means the
        # minted value contains a hyphen about five runs in six, so CI exercises BOTH the mainnet
        # (alphanumeric) and testnet (hyphenated) credential shapes on its own.
        ADMIN_API_SERVICE_TOKEN=@credential
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        IDENTITY_URL=http://127.0.0.1:4001
        LEDGER_URL=http://127.0.0.1:4007
        MARKET_URL=http://127.0.0.1:4013
        BILLING_URL=http://127.0.0.1:4009
        # Required with no default (src/env.ts): the service refuses to start without it, so the
        # image smoke test cannot reach /livez without it either. `development` is correct for CI —
        # it is a throwaway container, and naming `mainnet` here would be a lie in a file that is
        # copied.
        ADMIN_API_ESTATE_ENVIRONMENT=development
    secrets:
      # @cloudsforge/* is resolved by link:../runtime, so CI checks out micro-runtime and
      # micro-contracts as siblings — both private, so the workflow needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [ci, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
